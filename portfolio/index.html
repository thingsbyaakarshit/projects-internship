<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home-page</title>
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="flex flex-col min-h-screen bg-gray-50 text-gray-900 antialiased">
  <!-- Sticky Navbar -->
  <div class="sticky top-0 z-10 p-10">
    <!-- Sticky Navbar -->
    <header class="max-w-3xl mx-auto bg-white shadow-sm px-6 py-3 rounded-full flex justify-between items-center">
      <a id="home-link" href="#hero" class="text-xl font-bold">.me.</a>
      <a id="about-link" href="#about" class="cursor-pointer hover:scale-110">
        <img src="./assets/face.svg" alt="nav icon">
      </a>
    </header>
  </div>

  <!-- Hero Section -->
  <main id="hero" class="relative flex flex-col justify-center items-center min-h-[80vh] text-center py-12">
    <!-- Heading -->
    <h1 class="text-5xl font-bold max-w-2xl leading-tight mb-6">Ideas flow best when shared — let’s chat 💬</h1>

    <!-- Centered Button -->
    <button id="down-btn"
      class="absolute top-2/3 left-1/2 -translate-x-1/2 -translate-y-1/2 px-6 py-3 border-2 border-gray-800 rounded-xl flex items-center gap-3 shadow-sm hover:scale-105 transition">
      <p class="text-2xl font-semibold">Reach Out</p>
      <img src="./assets/share.svg" alt="share-icon">
    </button>

    <!-- Background Circles -->
    <div class="absolute top-10 left-20 -z-10
      w-64 h-64 rounded-full bg-purple-400 
      blur-3xl opacity-30"></div>
    <div class="absolute bottom-10 right-20 -z-10
      w-80 h-80 bg-pink-400 rounded-full
      blur-3xl opacity-30"></div>
  </main>

  <!-- Fixed Button -->
  <button id="up-btn" class="fixed bottom-6 right-6 z-50 p-3 border rounded-xl  shadow-sm  hover:scale-105 transition">
    <img src="/assets/arrow-up.png" alt="">
  </button>

  <!-- Projects Section -->
  <div id="projectsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto py-12">
  </div>

  <!-- About component -->
  <section id="about" class="max-w-6xl mx-auto px-6 py-24 grid grid-cols-1 md:grid-cols-[160px_1fr] gap-12 items-start">
  </section>

  <!-- footer -->
  <footer id="footer" class="mt-auto mb-6 px-4 max-w-7xl mx-auto">
  </footer>

  <script type="module" src="./main.js"></script>
</body>

</html>
