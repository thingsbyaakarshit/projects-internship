<!-- footer-header -->
<div class="mb-8">
  <h1 class="text-[14vw] text-center font-bold">Contact Me</h1>
</div>

<!-- footer-address | form -->
<div class="grid grid-cols-1 sm:grid-cols-2 mb-12 gap-6">
  <!-- footer-address -->
  <div class="flex justify-between gap-6 sm:flex-col sm:justify-normal">
    <div>
      <p>42 XX Street, XX Town,<br>HP 1XXXX2</p>
    </div>
    <div>
      <p>Office Hours<br>10am-4pm</p>
    </div>
  </div>

  <!-- footer-form -->
  <div class="">
    <form id="contactForm" action="#" class="flex flex-col gap-4">
      <div class="flex flex-col gap-3">
        <label for="name" class="text-sm text-gray-700">Name</label>
        <input id="name" name="name" type="text" placeholder="Name..."
          class="border-b-2 border-gray-300 focus:outline-none py-2">
        <label for="email" class="text-sm text-gray-700">Email</label>
        <input id="email" name="email" type="email" placeholder="Email..."
          class="border-b-2 border-gray-300 focus:outline-none py-2">
      </div>
      <div class="flex flex-col gap-3">
        <label for="message" class="text-sm text-gray-700">What do you wanna talk about?</label>
        <textarea id="message" name="message" placeholder="Thoughts..."
          class="border-b-2 border-gray-300 focus:outline-none py-2"></textarea>
      </div>
      <div class="flex items-center justify-end mt-2">
        <button id="contactSubmit" type="submit"
          class="px-4 py-2 bg-gray-900 text-white rounded-md hover:scale-110 transition-all w-full sm:w-fit duration-200">Send</button>
      </div>
    </form>

    <div id="contactStatus" class="mt-4 text-sm" aria-live="polite"></div>
  </div>
</div>

<!-- footer-contacts -->
<div class="mb-6 flex flex-col gap-4 sm:justify-between sm:flex-row">
  <div>
    <h2 class="text-lg font-semibold text-center sm:text-left">email@example.com</h2>
  </div>
  <div>
    <h2 class="text-lg font-semibold text-center sm:text-left">(+91) 782 *** 8940</h2>
  </div>
</div>

<!-- footer-necessities -->
<div class="flex flex-col sm:flex-row sm:justify-between gap-4">
  <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
    <div>
      <p class="text-center sm:text-left">Follow me</p>
    </div>
    <div class="flex gap-4 justify-center">
      <a href=""><img src="./assets/instagram-icon.svg" alt=""></a>
      <a href=""><img src="./assets/pinterest-icon.svg" alt=""></a>
      <a href=""><img src="./assets/twitter-icon.svg" alt=""></a>
    </div>
  </div>

  <!-- footer-copyright -->
  <div class="">
    <p class="text-sm text-gray-500 text-center sm:text-left">@2025 blo._.oooooog All rights reserved.</p>
  </div>
</div>
